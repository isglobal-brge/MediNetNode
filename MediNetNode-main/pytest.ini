[pytest]
DJANGO_SETTINGS_MODULE = medinet.settings_test
python_files = tests.py test_*.py *_tests.py
# Dropped --maxfail=1 and --disable-warnings: they stopped at the first failure
# and hid warnings (including unregistered-marker warnings), masking real issues.
addopts = -vv --showlocals --durations=10 -ra
log_cli = true
log_cli_level = INFO
markers =
    unit: fast, isolated unit tests
    integration: cross-component / DB / API integration tests
    slow: long-running tests (federated training, multi-process)

